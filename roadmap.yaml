# engine-control roadmap — seeded at Step 0 (2026-08-10).
# Baselines are pinned SHAs chosen at preflight:
#   internet: engine-lab tip — linear descendant of main -> add-discovery-engine
#             -> youtube-video-level-fallback; contains the discovery engine,
#             youtube fallback and the engine lab (all of which the roadmap needs).
#   ai:       commit-pending-export-work tip — main + the ChatGPT export
#             resilience work (main lacks it; the roadmap depends on it).
version: 1

defaults:
  lane: task

repos:
  internet:
    source: 'C:\github\internet'
    workspace: 'C:\projects\automation-workspace\internet'
    baseline: 1cdfa0989ee5de37e2d816d60f2adc3f4eec8dfc
    pr_base: main                # deploy branch the appliance auto-updates from (self_update); validated automation must PR here, not a branch nothing deploys. baseline == this branch's tip: PR shows only automation work
    tests:
      - python test_discovery.py
      - python test_watch.py
  ai:
    source: 'C:\github\ai'
    workspace: 'C:\projects\automation-workspace\ai'
    baseline: 8c7e08d2f77d91cf3e75684065e247cabcb82897
    pr_base: commit-pending-export-work   # baseline == this branch's tip
    tests:
      - python -m unittest discover -p "test_*.py"

# depends_on entries name steps that must be ACCEPTED first; the qualifier
# ':validated' is satisfied once the dependency reaches SOAKING (its work is
# integrated and validated; only the soak observation remains). Steps without
# dependencies run in parallel up to the detected capacity envelope.
# background: true marks low-priority evidence lanes that must never steal a
# critical-path slot. audit: true dispatches the independent audit role
# instead of the plan/implement pipeline.
steps:
  - id: step-01
    ordinal: 1
    title: Internet as an appliance
    repos: [internet]
    depends_on: []
    objective: |
      Make production discovery continuously operational without dependence on
      an SSH session: real scheduler, feedback listener, authenticated
      Chrome/CDP dependency handling, Telegram sending, service recovery and
      health visibility. Use Windows Scheduled Tasks (the machine's proven
      convention), never SSH-session children. The product should become
      something the owner forgets exists until it sends something useful.
    acceptance: |
      Realistic kill/recovery and dependency-failure tests (Chrome/CDP down,
      Telegram down, machine-sleep gap), not merely task creation. Health
      state must be observable via stats.py counters.

  - id: step-02
    ordinal: 2
    title: ai -> internet personal state contract
    repos: [ai, internet]
    depends_on: []
    objective: |
      Create a stable versioned derived-state contract from the ai repository
      to internet. internet must never couple to raw conversations.db — it
      consumes a versioned derived artifact with a documented schema. Keep
      repo responsibilities clean: ai derives and publishes, internet consumes.
      Cross-repo: ordered repo tasks (ai producer first, internet consumer
      second), each in its own worktree, integration validated across both.
    acceptance: |
      Contract file versioned and schema-documented; internet reads only the
      contract; both repos' canonical suites green; a contract-version bump
      path exists and is tested.

  - id: step-03
    ordinal: 3
    title: Knowledge state
    repos: [ai]
    depends_on: [step-02]
    experiment: true
    objective: |
      Create a useful representation of what the owner already knows/believes,
      distinct from what interests them, so novelty can become genuinely
      personalized. Prove value through replay/evaluation over existing
      conversation history rather than assuming the representation is useful.
      Record hypothesis, baseline, primary metric, stopping and falsification
      conditions before evaluation.
    acceptance: |
      Pre-registered replay evaluation executed; result recorded honestly even
      if negative; representation format documented in the step-02 contract
      lineage. A properly measured negative result is a PASS.

  - id: step-04
    ordinal: 4
    title: Weak behavioral labels
    repos: [ai]
    depends_on: [step-02]
    experiment: true
    objective: |
      Extract noisy-but-useful supervision from conversation behavior:
      recurrence, sustained follow-up, depth, rapid abandonment, response
      rejection. Keep provenance and uncertainty on every label. Weak signals
      are never treated as ground truth downstream.
    acceptance: |
      Label extraction runs over the corpus with provenance + uncertainty
      fields; distribution sanity checks recorded; no downstream consumer
      treats weak labels as gold.

  - id: step-05
    ordinal: 5
    title: Future-self experiment
    repos: [ai, internet]
    depends_on: [step-03, step-04]
    experiment: true
    models: {planner: fable}
    objective: |
      Freeze personal/knowledge state at historical time T and evaluate how
      well it predicts later interests/conversations. Pre-register baselines
      and metrics BEFORE examining outcomes. A properly executed falsification
      is a successful step. The result must explicitly change the assumptions
      used by later steps (recorded in the handoff implications).
    acceptance: |
      Pre-registration artifact exists before any outcome is examined;
      leakage/contamination protections documented; result + implication
      recorded in handoff; later-step assumptions updated accordingly.

  - id: step-06
    ordinal: 6
    title: High-information teaching UI
    repos: [internet]
    depends_on: [step-05]
    objective: |
      Build the smallest useful interface for explicit teaching/labeling,
      prioritizing uncertain/high-information cases rather than indiscriminate
      rating. No large dashboard. Reuse the existing feedback flow where
      possible.
    acceptance: |
      Uncertainty-ranked queue demonstrably surfaces high-information items;
      labels flow into the existing feedback store; UI stays minimal (measured
      in code size; no new framework).

  - id: step-07
    ordinal: 7
    title: Dynamic interests
    repos: [internet]
    depends_on: [step-05]
    objective: |
      Layered interest state: OWNER / INFERRED / EMERGING / EXPLORATORY.
      Owner-written interests remain authoritative and are never silently
      overwritten. Derived interests evolve with explicit provenance,
      promotion and decay rules. If planning stalls twice, escalate planner to
      fable (dynamic-interest architecture checkpoint).
    acceptance: |
      Owner interests provably immutable by automation; promotion/decay rules
      unit-tested; provenance queryable for every derived interest.

  - id: step-08
    ordinal: 8
    title: Close the product loop
    repos: [ai, internet]
    depends_on: [step-01, step-06, step-07]
    models: {planner: fable}
    objective: |
      Connect conversation-derived state -> internet discovery -> feedback and
      discoveries -> future state. Guard against circular self-confirmation
      and feedback leakage: derived state influencing discovery must not be
      fed back as if it were fresh evidence. Provenance must make every
      important derived state traceable end-to-end.
    acceptance: |
      Loop demonstrated on real data; a leakage test proves a synthetic
      injected preference does not self-amplify; provenance chain queryable.

  - id: step-09a
    ordinal: 9
    title: Connector evidence collection (background lane)
    repos: [internet]
    depends_on: ['step-01:validated']
    background: true
    experiment: true
    objective: |
      LOW-RISK, read-only connector reconnaissance collected EARLY so the
      final step-09 decision does not pay all evidence latency at once:
      source availability checks, bounded candidate retrieval samples,
      marginal unique-item yield vs existing sources, overlap analysis,
      failure/rate-limit behavior, candidate relevance distributions.
      Strictly no production mutation: no collector registration, no config
      change, no promotion, no large external API spend. Results must be
      persisted with provenance/timestamps so later evaluation can use only
      evidence that existed at the appropriate time. Incorporate existing
      engine-lab evidence (X prompt-lab conclusions, proposal ledger) as
      evidence, not immutable truth.
    acceptance: |
      Evidence artifacts persisted and reproducible; provably zero production
      config/DB mutation (diff shows no collector/production changes beyond
      additive evidence artifacts + read-only tooling); external spend within
      the pre-registered bound recorded in the plan.

  - id: step-09
    ordinal: 10
    title: Information-frontier connector decision
    repos: [internet]
    depends_on: [step-08, step-09a]
    experiment: true
    objective: |
      Do not hard-code a connector choice. Using step-09a evidence plus the
      personalization/closed-loop evidence from step-08, measure which
      currently-missing source adds the highest marginal unique information
      value; run bounded connector experiments before production promotion.
    acceptance: |
      Candidate connectors compared on pre-registered marginal-value metrics;
      only the winner (if any) promoted, behind the standard collector
      interface; losers recorded with evidence in the handoff.

  - id: step-10
    ordinal: 11
    title: Exploration engine
    repos: [internet]
    depends_on: [step-08]
    models: {planner: fable}
    objective: |
      Separate exploitation of known interests from exploration of adjacent
      unknown interests: distinct budgets, thresholds, metrics and failure
      containment. May run concurrently with the step-09 connector decision
      when the planner confirms their interfaces do not conflict; the final
      whole-system audit is step-11.
    acceptance: |
      Exploration budget provably capped and isolated from exploitation
      quality metrics; canonical suites green at integration.

  - id: step-11
    ordinal: 12
    title: Final whole-system audit
    repos: [internet]
    depends_on: [step-09, step-10]
    audit: true
    models: {audit: fable}
    objective: |
      Independent high-capability audit (fresh context, read-only) of both
      the product architecture (discovery, personal/knowledge state, teaching
      loop, dynamic interests, exploration engine, connectors) and the
      development-control architecture that produced it. Verifies roadmap
      acceptance criteria against code and artifacts, not claims. Privacy
      boundary: derived/aggregate state only — never raw conversation bodies.
    acceptance: |
      Audit verdict PASS with no critical/major findings; findings and
      implications recorded in the handoff.

  - id: step-12
    ordinal: 13
    title: Continuous council-driven web discovery
    repos: [internet]
    depends_on: []
    objective: |
      Replace production web discovery's periodic single-static-prompt
      retrieval path with a durable, continuously executed queue of
      council-generated research missions.

      This is a production feature, not an experiment. Do not create an
      old-vs-new baseline, A/B arms, promotion gate, evaluator framework,
      or statistical quality proof.

      First reconcile the post-MVP automation/integration tip with the
      already-working chatgpt_browser provider currently present on main.
      The completed implementation must contain both bodies of work.

      Reuse the existing main LLM Council design from the sibling ai repo:
      five independent advisors (Contrarian, First-Principles,
      Expansionist, Outsider, Executor), anonymized peer review, and
      Chairman synthesis. Port the stable Council reasoning instructions
      into an internet-owned module; internet must not runtime-import the
      ai application.

      For each owner interest, Council planning must receive:
      - the complete owner interest definition;
      - a bounded recent discovery frontier;
      - bounded recent explicit user feedback;
      - the previous bounded set of generated search missions.

      The Chairman must return a configurable batch of genuinely distinct
      research missions, each containing label, rationale and a complete
      executor prompt.

      Search generations and missions are durable runtime state. Persist
      enough information to resume them after process death, machine sleep,
      provider failure or restart and to recover the exact producing
      mission for a later CandidateItem.

      Replace the scheduled web collector's current full-interest batch
      semantics with a short-lived `web-tick` execution model. Keep the
      existing Windows Scheduled Task name/control surface, but run it at
      one-minute cadence.

      Every web tick must:
      1. recover stale mission leases;
      2. replenish at most one interest whose mission queue is below its
         low-water mark;
      3. select eligible pending work fairly across owner interests;
      4. transactionally lease a bounded number of missions;
      5. execute each mission independently using the configured
         search-capable ChatGPT provider;
      6. attach generation/mission provenance to returned CandidateItems;
      7. feed candidates through the existing normalize -> dedup ->
         persist -> matching -> prefilter -> scoring -> exploit/explore
         budget -> threshold -> notification machinery;
      8. persist mission completion/failure and provider usage.

      Council generation must not occur every minute for every interest.
      It replenishes a durable reservoir of missions. Continuous execution
      means advancing that reservoir every tick, not regenerating the same
      interest prompt repeatedly.

      Mission selection must provide cross-interest fairness so a large
      queue for one interest cannot starve others.

      Search executors must treat Council prompts as research missions,
      not literal single search queries: they may iteratively search,
      follow discovered entities/terminology/references, and return several
      genuinely distinct candidate discoveries.

      Existing scoring, feedback, dynamic-interest, exploration-lane,
      Telegram message-format and YouTube semantics remain intact except
      for the minimum refactoring required to reuse the existing ingest
      pipeline from the web mission runtime.

      Keep the legacy static web-search prompt only as bounded fallback
      when Council generation fails repeatedly.
    acceptance: |
      - Post-MVP features and chatgpt_browser coexist on the integration tip.

      - The installed web Scheduled Task runs the new bounded `web-tick`
        path at approximately one-minute cadence rather than running the
        complete static web collector across every interest.

      - Empty startup self-populates mission queues without a burst across
        all interests.

      - Council generation uses the existing five-advisor + peer-review +
        Chairman reasoning architecture and returns strict structured
        missions.

      - Council context contains recent discoveries, recent explicit
        feedback, and previous mission history while excluding downstream
        score thresholds/weight targets.

      - Search generations/missions survive process death and restart.

      - A stale RUNNING mission can be safely reclaimed without duplicate
        concurrent execution.

      - One failed planner or executor call does not stop unrelated
        interests or missions.

      - Mission execution is fair across interests.

      - Every discovered CandidateItem can be traced to its generation,
        mission label and exact prompt/hash.

      - Returned discoveries pass through the existing production pipeline;
        no parallel scorer, deduper or notifier is introduced.

      - Current separate exploit/explore score budgets continue to work.

      - Default tuning is configurable without modifying interests.json:
        mission batch size, low-water mark, missions per tick, search uses
        per mission, results per mission, frontier size, feedback-context
        size and retry/lease timing.

      - Operational tests cover startup refill, round-robin fairness,
        queue refill, crash/recovery, stale lease recovery, planner failure,
        malformed Council output, executor failure, duplicate discoveries,
        provenance, provider outage, and a stubbed full web-tick ->
        CandidateItem -> scoring pipeline run.

      - Existing canonical test suites remain green.

      - No A/B/baseline/quality-comparison framework is added.

  - id: step-13
    ordinal: 14
    title: Interactive discovery observatory
    repos: [internet]
    depends_on: [step-12]
    models: {planner: fable}

    objective: |
      Build a detailed, local-first web application that makes every discovery
      visually and causally inspectable.

      The primary product is an INTERACTIVE FLOWCHART of the exact execution
      graph—not a numbered timeline and not a generic dashboard.

      From any Telegram discovery, candidate, mission, generation or interest,
      the owner must be able to open one page and see the complete branching
      path that produced it:

        interest state
          -> Council context
          -> exact Council prompt
          -> explicit Council deliberation
          -> Chairman decision
          -> generated missions
          -> exact mission-executor prompt
          -> web-search/tool events
          -> every returned result
          -> normalization
          -> duplicate decision
          -> persistence
          -> all interest matches
          -> prefilter
          -> exact scoring/value prompt
          -> explicit decision explanation
          -> parsed result
          -> threshold/delivery decision
          -> exact Telegram rendering
          -> Telegram response
          -> later feedback

      A Council call must branch into all generated missions. A mission must
      branch into all returned results. Each result must branch through its own
      pipeline. Duplicate, filtered, deferred, failed and unsent branches must
      remain visible; the UI must not show only the successful Telegram path.

      IMPLEMENTATION STACK

      - Datasette runs directly against the live discovery.db and provides:
        native table browsing, filtering, sorting, SQL inspection, row pages and
        JSON APIs.
      - A small in-repo Datasette plugin serves the custom observatory routes and
        the compiled frontend.
      - React + TypeScript + React Flow renders the graph.
      - ELK.js performs left-to-right layered automatic layout after nodes are
        expanded or collapsed.
      - Vite builds static assets committed or packaged with the Python plugin.
      - The UI is read-only. It must never mutate discovery state.
      - Datasette must not run in immutable mode because discovery.db continues
        changing while the UI is open.
      - Add:
          python -m app ui --host 127.0.0.1 --port 8001
      - Add an optional authenticated ngrok launch path:
          python -m app ui --public
        It must require configured authentication and never expose the database
        anonymously.

      TRACE STORAGE

      Add append-only, additive SQLite tables:

      1. trace_runs
         - id
         - command/job type
         - provider/model configuration
         - redacted configuration snapshot
         - started_at / finished_at
         - status / error

      2. trace_nodes
         - id
         - run_id
         - node_type
         - entity_type / entity_id
         - label
         - status
         - summary
         - input_json
         - output_json
         - exact_text
         - started_at / finished_at
         - error

      3. trace_edges
         - from_node_id
         - to_node_id
         - relationship
         - ordinal

         Relationships include:
         generated, selected, executed, returned, normalized_to, duplicate_of,
         matched, rejected, deferred, scored, cleared_threshold, rendered,
         sent, failed, retried_as and feedback_on.

      4. model_calls
         - trace_node_id
         - call_role: council | mission_search | scoring | value_distillation
         - attempt
         - provider / model
         - exact_system_prompt
         - exact_user_prompt
         - exact_schema_json
         - exact_parameters_json
         - raw_response_text
         - parsed_response_json
         - validation_result
         - usage_json
         - provider_request_id where available
         - started_at / finished_at
         - error

      Every retry is a separate model_calls row. Never overwrite an earlier
      failed attempt.

      Instrument provider calls centrally through the provider abstraction,
      rather than manually duplicating logging in Council, missions and scoring.
      Capture the exact final prompt after all framing, schema suffixes and retry
      instructions have been applied.

      Extend browser-provider parsing to retain every observable search/tool
      event exposed in the streamed response: search query, tool start/end,
      citations, result URLs, snippets and failures. When a provider does not
      expose an internal search event, render an explicit
      "not exposed by provider" node. Never fabricate the missing event.

      Create a trace node before deduplication so even a raw result rejected as
      a duplicate has a persistent observable branch.

      EXPLICIT REASONING VISIBILITY

      The current Council intentionally hides its five advisor answers, peer
      reviews and Chairman synthesis. Change the Council response contract so
      the same call explicitly returns and persists:

      - five named advisor analyses;
      - the anonymized peer-review critiques and rankings;
      - aggregate ranking;
      - disagreements and rejected mission angles;
      - Chairman synthesis and mission-selection rationale;
      - final missions consumed by production.

      These fields are visible structured deliberation artifacts. Do not claim
      that provider-private hidden chain-of-thought is available. Anything not
      returned by the provider must be marked unavailable.

      The scoring/value call must similarly return, in the same existing call:

      - evidence used;
      - chosen interest and why;
      - rationale for each score or future value field;
      - important alternative interpretation considered;
      - why the result was not scored higher;
      - uncertainties and missing evidence;
      - final structured output consumed by production.

      This observability must add no extra LLM calls. The richer debug payload
      is returned by the calls already being made.

      WEB EXPERIENCE

      The default page is a full-screen three-pane observatory:

      LEFT — DISCOVERY EXPLORER

      - Search across titles, URLs, bottom lines, prompts and model outputs.
      - Filters for date, interest, layer, source, provider, model, mission,
        sent/not-sent, feedback verdict, failure stage and trace completeness.
      - Rows show timestamp, interest, discovery title/bottom line, final state,
        score/value strength, Telegram state and feedback.
      - Tabs:
          Discoveries
          Interests
          Council generations
          Missions
          Failed runs
          Raw database
      - Selecting any row loads its graph without navigating away.

      CENTER — INTERACTIVE FLOWCHART

      - Horizontal left-to-right execution graph.
      - Swimlanes:
          Personal/interest state
          Council
          Mission execution
          Candidate pipeline
          Scoring/value
          Delivery/feedback
      - The path leading to the selected Telegram output is emphasized.
      - Sibling missions, search results and rejected candidates remain visible
        but may initially appear as collapsed groups.
      - Double-click expands/collapses a group.
      - "Expand all" reveals every real event.
      - "Focus selected path" hides visual noise without deleting branches.
      - Include zoom, pan, minimap, fit-to-view and reset-layout controls.
      - Active/incomplete nodes visibly update through lightweight polling.
      - Node cards display type, concise result, status, timestamp, duration and
        child count.
      - Edge labels state the real relationship, such as:
          "generated mission"
          "result #4"
          "duplicate of"
          "matched at 0.91"
          "filtered because"
          "0.84 >= historical threshold 0.75"
      - No synthetic generic stage nodes. Every displayed node corresponds to
        an actual persisted event, call, decision or database entity.

      RIGHT — NODE INSPECTOR

      Clicking any node opens a large inspector with tabs:

      - Overview
      - Exact input
      - Exact output
      - Raw response
      - Parsed JSON
      - Reasoning record
      - Configuration
      - Timing/usage
      - Database rows

      Long prompts and responses use a readable monospace viewer with:

      - preserved whitespace;
      - wrapping toggle;
      - syntax-highlighted JSON;
      - copy button;
      - full-screen mode;
      - download button;
      - visible truncation warning if anything was not stored.

      Every node includes direct links to its corresponding Datasette rows.
      Every source-result node includes the source URL and the exact raw result
      position returned by the executor.

      INTEREST VIEW

      Clicking an interest must show:

      - the complete interest definition;
      - layer and provenance;
      - positive/negative signals;
      - current configuration;
      - interest-event history;
      - Council contexts generated from it;
      - every generation and mission;
      - discoveries, failures and feedback associated with it.

      COMPARISON MODE

      Allow selecting two traces, Council generations, model calls or prompt
      versions and display:

      - side-by-side flowcharts;
      - prompt diff;
      - response diff;
      - changed context fields;
      - changed mission branches;
      - changed score/value decisions;
      - changed delivery outcome.

      This is required so prompt optimization can be based on concrete
      before/after behavior rather than memory.

      TELEGRAM CONNECTION

      When DISCOVERY_OBSERVATORY_BASE_URL is configured, append a URL button to
      each Telegram item:

          🔬 Open full trace

      The URL deep-links directly to:

          /observatory/trace/score/<score_id>

      Preserve all existing feedback buttons. When no public base URL is
      configured, omit the trace button.

      MOBILE EXPERIENCE

      The UI must work well on iPhone:

      - discovery list becomes a slide-out drawer;
      - graph remains touch-pan/zoom capable;
      - node inspector becomes a full-screen bottom sheet;
      - prompt/output text remains selectable and copyable;
      - opening a Telegram trace link lands directly on the highlighted path.

      SECURITY

      - Bind to localhost by default.
      - Public/ngrok mode requires authentication.
      - Never persist cookies, authorization headers, API keys, Telegram tokens,
        session tokens or Chrome authentication material.
      - Redact secrets while preserving complete prompts, schemas, model
        responses and non-secret request parameters.
      - UI and Datasette access share the same authentication boundary.

      Keep the graph schema extensible so the following Personal Value Updates
      step can add target_hinge, value_mode, bottom_line and personal relevance
      nodes without redesigning the observatory.

    acceptance: |
      A deterministic fixture creates one interest, one Council generation,
      multiple advisor outputs, three missions, multiple search results and
      branching candidate outcomes including:

      - one duplicate;
      - one prefilter rejection;
      - one scoring failure followed by a retry;
      - one score below threshold;
      - one successful Telegram discovery with feedback.

      Opening the successful discovery displays one connected interactive graph
      containing every branch above—not only the winning path.

      The exact prompts shown in the inspector are byte-for-byte equal to the
      strings passed to the fake providers after all framing and retry suffixes.

      Raw and parsed model responses are both visible. Failed attempts remain
      visible after successful retries.

      The Council node expands into five advisor records, peer-review records,
      aggregate ranking, Chairman synthesis and final missions.

      Every raw mission result maps unambiguously to either a candidate,
      duplicate, error or rejection node.

      Historical traces preserve the exact interest/configuration snapshot,
      threshold and Telegram text used at the time, even after current
      interests, prompts or thresholds change.

      Datasette exposes every operational and trace table read-only, and each
      graph node can open its relevant database rows.

      Compare mode produces correct prompt, response and topology differences
      between two fixture traces.

      The Telegram deep link opens the correct score trace and highlights the
      exact sent path.

      Desktop and iPhone-sized browser tests verify list navigation, graph
      pan/zoom, expand/collapse, inspector viewing and prompt copying.

      Trace instrumentation makes no additional provider calls and does not
      alter candidate ranking, deduplication, filtering, notification or
      feedback behavior.

      Secret-redaction tests prove that authentication tokens and cookies never
      enter trace storage or API responses.

      Large traces are lazy-loaded and remain usable: the discovery list is
      paginated, collapsed groups do not fetch full child payloads until opened,
      and opening a normal trace does not load the entire database.

      The canonical discovery/watch suites, new trace tests, frontend tests and
      one end-to-end browser smoke test are green.
